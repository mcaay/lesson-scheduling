{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dance Lesson Scheduler</title>
        <link rel="stylesheet" href="{% static 'scheduler/styles.css' %}">
        <script src="{% static 'scheduler/app.js' %}" defer></script>
    </head>
    <body>
        <main>
            {% block content %}{% endblock %}
        </main>
        <div class="solver-loading" data-solver-loading role="status" aria-live="polite" hidden>
            <span class="solver-spinner" aria-hidden="true"></span>
            <strong>Finding the best schedule...</strong>
            <span>This may take up to 2 minutes.</span>
        </div>
    </body>
</html>
